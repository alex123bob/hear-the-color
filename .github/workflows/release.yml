# Builds the frontend when a version tag (v*) is pushed and publishes dist/ as a GitHub Release asset.
# The server has no Node, so it just downloads hear-the-color-dist.tar.gz (see scripts/server-deploy.sh).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # VITE_API_BASE_URL stays unset on purpose: the page calls the same origin it is served from
      - run: npm run build
      - name: Package dist
        run: tar -czf hear-the-color-dist.tar.gz -C dist .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" hear-the-color-dist.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
